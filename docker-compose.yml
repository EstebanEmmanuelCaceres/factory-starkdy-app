services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: factory-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://72.61.27.14:8000
    depends_on:
      - backend
    networks:
      - factory-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: factory-backend
    ports:
      - "8000:80"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - APP_ENV=production
      - APP_DEBUG=false
      - CORS_ALLOWED_ORIGINS=http://72.61.27.14:3000/
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - factory-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: factory-db
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - factory-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: factory-redis
    networks:
      - factory-network
    restart: unless-stopped

networks:
  factory-network:
    driver: bridge

volumes:
  postgres-data:
