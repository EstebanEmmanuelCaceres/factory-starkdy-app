services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        # Se incrusta en el bundle durante el build. Si cambia esta URL
        # hay que rebuildear: `docker compose up -d --build frontend`.
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    container_name: factory-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - factory-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: factory-backend
    ports:
      - "${BACKEND_PORT:-8000}:80"
    volumes:
      # Obligatorio: backend/.dockerignore excluye laravel/, así que el código
      # de la app NO está en la imagen. Sin este mount, /var/www/html va vacío.
      - ./backend/laravel:/var/www/html
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - APP_ENV=production
      - APP_DEBUG=false
      # Sin barra final: el header Origin nunca la trae y Laravel compara exacto.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - factory-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: factory-db
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - factory-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: factory-redis
    networks:
      - factory-network
    restart: unless-stopped

networks:
  factory-network:
    driver: bridge

volumes:
  postgres-data:
