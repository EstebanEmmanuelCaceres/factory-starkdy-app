services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "${FRONTEND_PORT:-3100}:3000"
    environment:
      INTERNAL_BACKEND_URL: http://backend:80
    depends_on:
      - backend
    networks:
      - starkdy-dev-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8100}:80"
    volumes:
      - ./backend/laravel:/var/www/html
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_ENV: local
      APP_DEBUG: "true"
      CORS_ALLOWED_ORIGINS: https://dev.starkdy.com.ar
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - starkdy-dev-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - starkdy-dev-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - starkdy-dev-network
    restart: unless-stopped

networks:
  starkdy-dev-network:
    driver: bridge

volumes:
  postgres-dev-data:
